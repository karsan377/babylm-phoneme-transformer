program: train_gpt2.py

command:
  - ${env}
  - ${interpreter}
  - ${program}

method: random

metric:
  name: final_eval_perplexity
  goal: minimize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.0001

  gradient_accumulation_steps:
    distribution: q_log_uniform_values
    min: 1
    max: 16
    q: 1

  lr_scheduler_type:
    values:
      - linear
      - cosine
